name: Test, Build AMI and Refresh ASG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysite-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  GIT_REPOSITORY: https://github.com/seoboseong2712/mysite.git
  PROJECT_DIR: /home/ubuntu/mysite
  VENV_DIR: /home/ubuntu/mysite/venv
  GUNICORN_SERVICE: gunicorn
  EFS_MOUNT_POINT: /srv/efs/mysite/media
  S3_STATIC_URI: s3://mysite-boseong/static/

  # ASG/AMI 배포 설정
  # 기존 서비스용 Backend A/B와 ASG 인스턴스를 태그로 섞어 찾지 않고,
  # Golden Image 제작용 EC2 한 대를 GitHub Secret으로 명시한다.
  LAUNCH_TEMPLATE_NAME: mysite-backend-template
  ASG_NAME: mysite-django-asg

jobs:
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11

        env:
          MARIADB_DATABASE: testdb
          MARIADB_USER: tester
          MARIADB_PASSWORD: test-password
          MARIADB_ROOT_PASSWORD: root-test-password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
        
      - name: Install MariaDB build packages
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            default-libmysqlclient-dev

      - name: Install Python dependencies
        run: |
          set -Eeuo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
      # settings.py에서 BASE_DIR/.env를 읽으므로
      # 테스트 실행용 임시 .env를 생성
      - name: Create test environment file
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > .env <<'EOF_ENV'
          DJANGO_SECRET_KEY="github-actions-test-secret-key"
          DJANGO_DEBUG="False"
          DJANGO_ALLOWED_HOSTS="localhost,127.0.0.1,testserver"

          DB_ENGINE="django.db.backends.mysql"
          DB_NAME="testdb"
          DB_USER="tester"
          DB_PASSWORD="test-password"
          DB_HOST="127.0.0.1"
          DB_PORT="3306"

          STATIC_URL="/static/"
          STATIC_ROOT="staticfiles"
          MEDIA_ROOT="/tmp/mysite/media/"
          EOF_ENV

          mkdir -p /tmp/mysite/media
          chmod 600 .env

      - name: Check Django configuration
        run: |
          set -Eeuo pipefail
          python manage.py check

      - name: Check missing migrations
        run: |
          set -Eeuo pipefail
          python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: |
          set -Eeuo pipefail
          python manage.py test board --verbosity 2


  # ============================================================
  # 2. Golden Image 생성 + ASG Instance Refresh
  # ============================================================
  deploy:
    name: Build AMI and Refresh ASG
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -Eeuo pipefail
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # Golden Image 제작용 기준 EC2
      # GitHub Environment(production) Secret:
      # AMI_BUILDER_INSTANCE_ID = 기존 mysite-backend-A의 Instance ID 권장
      # ----------------------------------------------------------
      - name: Validate AMI builder instance
        id: builder
        shell: bash
        env:
          AMI_BUILDER_INSTANCE_ID: ${{ secrets.AMI_BUILDER_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail

          if [ -z "${AMI_BUILDER_INSTANCE_ID:-}" ]; then
            echo "GitHub Secret AMI_BUILDER_INSTANCE_ID가 필요합니다."
            exit 1
          fi

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$AMI_BUILDER_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          if [ "$STATE" != "running" ]; then
            echo "AMI Builder EC2가 running 상태가 아닙니다: $STATE"
            exit 1
          fi

          echo "AMI Builder: $AMI_BUILDER_INSTANCE_ID"
          echo "instance_id=$AMI_BUILDER_INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # 운영 .env 생성
      # ----------------------------------------------------------
      - name: Build production environment file
        id: production_env
        shell: bash
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          DB_ENGINE: ${{ secrets.DB_ENGINE }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          STATIC_URL: ${{ secrets.STATIC_URL }}
          STATIC_ROOT: ${{ secrets.STATIC_ROOT }}
          MEDIA_ROOT: ${{ secrets.MEDIA_ROOT }}
        run: |
          set -Eeuo pipefail

          REQUIRED_SECRETS=(
            DJANGO_SECRET_KEY DJANGO_DEBUG DJANGO_ALLOWED_HOSTS
            DB_ENGINE DB_NAME DB_USER DB_PASSWORD DB_HOST DB_PORT
            STATIC_URL STATIC_ROOT MEDIA_ROOT
          )

          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!SECRET_NAME:-}" ]; then
              echo "필수 GitHub Secret이 비어 있습니다: $SECRET_NAME"
              exit 1
            fi
          done

          python <<'PY'
          import json
          import os
          from pathlib import Path

          groups = [
              ("# Django", ["DJANGO_SECRET_KEY", "DJANGO_DEBUG", "DJANGO_ALLOWED_HOSTS"]),
              ("# MariaDB", ["DB_ENGINE", "DB_NAME", "DB_USER", "DB_PASSWORD", "DB_HOST", "DB_PORT"]),
              ("# 정적 파일 및 미디어", ["STATIC_URL", "STATIC_ROOT", "MEDIA_ROOT"]),
          ]

          lines = []
          for title, keys in groups:
              lines.append(title)
              for key in keys:
                  lines.append(f"{key}={json.dumps(os.environ[key])}")
              lines.append("")

          Path("/tmp/production.env").write_text("\n".join(lines), encoding="utf-8")
          PY

          ENV_BASE64=$(base64 -w 0 /tmp/production.env)
          echo "::add-mask::$ENV_BASE64"
          echo "base64=$ENV_BASE64" >> "$GITHUB_OUTPUT"
          rm -f /tmp/production.env

      # ----------------------------------------------------------
      # Builder 한 대에만 최신 코드/환경/의존성을 적용
      # ----------------------------------------------------------
      - name: Update AMI builder
        id: update_builder
        shell: bash
        env:
          BUILDER_ID: ${{ steps.builder.outputs.instance_id }}
          PRODUCTION_ENV_BASE64: ${{ steps.production_env.outputs.base64 }}
          EFS_ENDPOINT: ${{ secrets.EFS_ENDPOINT }}
        run: |
          set -Eeuo pipefail

          if [ -z "${EFS_ENDPOINT:-}" ]; then
            echo "필수 GitHub Secret이 비어 있습니다: EFS_ENDPOINT"
            exit 1
          fi

          read -r -d '' REMOTE_SCRIPT <<SCRIPT || true
          set -Eeuo pipefail

          PROJECT_DIR="$PROJECT_DIR"
          VENV_DIR="$VENV_DIR"
          GIT_REPOSITORY="$GIT_REPOSITORY"
          GUNICORN_SERVICE="$GUNICORN_SERVICE"
          EFS_ENDPOINT="$EFS_ENDPOINT"
          EFS_MOUNT_POINT="$EFS_MOUNT_POINT"
          ENV_FILE="\$PROJECT_DIR/.env"

          if [ ! -d "\$PROJECT_DIR/.git" ]; then
            echo "Git 프로젝트를 찾을 수 없습니다: \$PROJECT_DIR"
            exit 1
          fi

          if [ ! -x "\$VENV_DIR/bin/python" ]; then
            echo "Python 가상환경을 찾을 수 없습니다: \$VENV_DIR"
            exit 1
          fi

          if ! command -v mount.nfs4 >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y nfs-common
          fi

          mkdir -p "\$EFS_MOUNT_POINT"
          EFS_HOST="\${EFS_ENDPOINT%%:*}"
          EFS_SOURCE="\${EFS_HOST}:/"
          FSTAB_OPTIONS="nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev,nofail,x-systemd.automount"
          FSTAB_ENTRY="\$EFS_SOURCE \$EFS_MOUNT_POINT nfs4 \$FSTAB_OPTIONS 0 0"

          cp /etc/fstab "/etc/fstab.backup.\$(date +%Y%m%d%H%M%S)"
          sed -i "\\|[[:space:]]\$EFS_MOUNT_POINT[[:space:]]|d" /etc/fstab
          printf '%s\n' "\$FSTAB_ENTRY" >> /etc/fstab

          systemctl daemon-reload
          if ! mountpoint -q "\$EFS_MOUNT_POINT"; then
            mount "\$EFS_MOUNT_POINT"
          fi
          mountpoint -q "\$EFS_MOUNT_POINT"

          mkdir -p "/etc/systemd/system/\$GUNICORN_SERVICE.service.d"
          cat > "/etc/systemd/system/\$GUNICORN_SERVICE.service.d/efs-mount.conf" <<EOF_SYSTEMD
          [Unit]
          Wants=network-online.target remote-fs.target
          After=network-online.target remote-fs.target
          RequiresMountsFor=\$EFS_MOUNT_POINT
          EOF_SYSTEMD
          systemctl daemon-reload

          sudo -u ubuntu -H git -C "\$PROJECT_DIR" remote set-url origin "\$GIT_REPOSITORY"
          sudo -u ubuntu -H git -C "\$PROJECT_DIR" fetch --prune origin
          sudo -u ubuntu -H git -C "\$PROJECT_DIR" reset --hard
          sudo -u ubuntu -H git -C "\$PROJECT_DIR" clean -fd -e .env -e media/ -e staticfiles/
          sudo -u ubuntu -H git -C "\$PROJECT_DIR" checkout -B main origin/main
          sudo -u ubuntu -H git -C "\$PROJECT_DIR" reset --hard origin/main

          printf '%s' "$PRODUCTION_ENV_BASE64" | base64 --decode > "\$ENV_FILE"
          chown ubuntu:ubuntu "\$ENV_FILE"
          chmod 600 "\$ENV_FILE"

          sudo -u ubuntu -H "\$VENV_DIR/bin/python" -m pip install --upgrade pip
          sudo -u ubuntu -H "\$VENV_DIR/bin/pip" install -r "\$PROJECT_DIR/requirements.txt"

          cd "\$PROJECT_DIR"
          sudo -u ubuntu -H "\$VENV_DIR/bin/python" manage.py check --deploy

          echo "적용 Commit:"
          sudo -u ubuntu -H git -C "\$PROJECT_DIR" rev-parse HEAD
          SCRIPT

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$BUILDER_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Prepare mysite AMI builder" \
            --timeout-seconds 1200 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Verify AMI builder update
        shell: bash
        env:
          BUILDER_ID: ${{ steps.builder.outputs.instance_id }}
          COMMAND_ID: ${{ steps.update_builder.outputs.command_id }}
        run: |
          set -Eeuo pipefail

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$BUILDER_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$BUILDER_ID" \
            --query "Status" \
            --output text)

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$BUILDER_ID" \
            --query "StandardOutputContent" \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$BUILDER_ID" \
              --query "StandardErrorContent" \
              --output text || true
            exit 1
          fi

      # ----------------------------------------------------------
      # DB migration / collectstatic / S3 sync는 Builder에서 1회만 수행
      # ----------------------------------------------------------
      - name: Migrate database and publish static files
        id: publish
        shell: bash
        env:
          BUILDER_ID: ${{ steps.builder.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          read -r -d '' REMOTE_SCRIPT <<SCRIPT || true
          set -Eeuo pipefail

          cd "$PROJECT_DIR"

          sudo -u ubuntu -H "$VENV_DIR/bin/python" manage.py migrate --noinput
          sudo -u ubuntu -H "$VENV_DIR/bin/python" manage.py collectstatic --noinput --clear

          STATIC_DIR=\$(sudo -u ubuntu -H \
            "$VENV_DIR/bin/python" manage.py shell -c \
            "from django.conf import settings; print(settings.STATIC_ROOT)" \
            | tail -n 1 | tr -d '\r')

          if [ ! -d "\$STATIC_DIR" ]; then
            echo "정적 파일 디렉터리가 없습니다: \$STATIC_DIR"
            exit 1
          fi

          aws s3 sync "\$STATIC_DIR/" "$S3_STATIC_URI/" --delete

          systemctl restart "$GUNICORN_SERVICE"
          sleep 3
          systemctl is-active --quiet "$GUNICORN_SERVICE"
          SCRIPT

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$BUILDER_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Migrate, publish static, verify builder" \
            --timeout-seconds 1200 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Verify migration and static deployment
        shell: bash
        env:
          BUILDER_ID: ${{ steps.builder.outputs.instance_id }}
          COMMAND_ID: ${{ steps.publish.outputs.command_id }}
        run: |
          set -Eeuo pipefail

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$BUILDER_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$BUILDER_ID" \
            --query "Status" \
            --output text)

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$BUILDER_ID" \
            --query "StandardOutputContent" \
            --output text || true

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$BUILDER_ID" \
              --query "StandardErrorContent" \
              --output text || true
            exit 1
          fi

      # ----------------------------------------------------------
      # 새 코드가 들어간 Builder를 AMI로 생성
      # ----------------------------------------------------------
      - name: Create AMI
        id: ami
        shell: bash
        env:
          BUILDER_ID: ${{ steps.builder.outputs.instance_id }}
        run: |
          set -Eeuo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          AMI_NAME="mysite-${SHORT_SHA}-$(date -u +%Y%m%d-%H%M%S)"

          AMI_ID=$(aws ec2 create-image \
            --instance-id "$BUILDER_ID" \
            --name "$AMI_NAME" \
            --description "mysite ${GITHUB_SHA}" \
            --tag-specifications \
              "ResourceType=image,Tags=[{Key=Project,Value=mysite},{Key=Environment,Value=production},{Key=GitCommit,Value=${GITHUB_SHA}}]" \
              "ResourceType=snapshot,Tags=[{Key=Project,Value=mysite},{Key=Environment,Value=production},{Key=GitCommit,Value=${GITHUB_SHA}}]" \
            --query "ImageId" \
            --output text)

          echo "새 AMI: $AMI_ID ($AMI_NAME)"
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"
          echo "ami_name=$AMI_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for AMI to become available
        shell: bash
        env:
          AMI_ID: ${{ steps.ami.outputs.ami_id }}
        run: |
          set -Eeuo pipefail
          aws ec2 wait image-available --image-ids "$AMI_ID"
          aws ec2 describe-images \
            --image-ids "$AMI_ID" \
            --query "Images[0].[ImageId,Name,State]" \
            --output table

      # ----------------------------------------------------------
      # 현재 LT 최신 버전을 복사하면서 ImageId만 새 AMI로 교체
      # ----------------------------------------------------------
      - name: Create launch template version
        id: lt
        shell: bash
        env:
          AMI_ID: ${{ steps.ami.outputs.ami_id }}
        run: |
          set -Eeuo pipefail

          VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-name "$LAUNCH_TEMPLATE_NAME" \
            --source-version '$Latest' \
            --version-description "GitHub ${GITHUB_SHA}" \
            --launch-template-data "{\"ImageId\":\"$AMI_ID\"}" \
            --query "LaunchTemplateVersion.VersionNumber" \
            --output text)

          echo "새 Launch Template 버전: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set launch template default version
        shell: bash
        env:
          LT_VERSION: ${{ steps.lt.outputs.version }}
        run: |
          set -Eeuo pipefail

          aws ec2 modify-launch-template \
            --launch-template-name "$LAUNCH_TEMPLATE_NAME" \
            --default-version "$LT_VERSION"

      # ASG가 특정 버전을 사용 중이어도 새 버전으로 명시적으로 갱신
      - name: Update Auto Scaling Group launch template
        shell: bash
        env:
          LT_VERSION: ${{ steps.lt.outputs.version }}
        run: |
          set -Eeuo pipefail

          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$ASG_NAME" \
            --launch-template \
              "LaunchTemplateName=$LAUNCH_TEMPLATE_NAME,Version=$LT_VERSION"

      # ----------------------------------------------------------
      # 새 AMI/LT 버전으로 ASG 인스턴스를 롤링 교체
      # ----------------------------------------------------------
      - name: Start ASG instance refresh
        id: refresh
        shell: bash
        run: |
          set -Eeuo pipefail

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":30,"SkipMatching":true}' \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for instance refresh
        shell: bash
        env:
          REFRESH_ID: ${{ steps.refresh.outputs.refresh_id }}
        run: |
          set -Eeuo pipefail

          # 최대 약 30분 대기. 실습 환경에서는 보통 훨씬 빨리 끝난다.
          for i in $(seq 1 90); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Instance Refresh: status=$STATUS, progress=${PERCENT}%"

            case "$STATUS" in
              Successful)
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                aws autoscaling describe-instance-refreshes \
                  --auto-scaling-group-name "$ASG_NAME" \
                  --instance-refresh-ids "$REFRESH_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 20
          done

          echo "Instance Refresh 대기 시간이 초과되었습니다."
          exit 1

      # ----------------------------------------------------------
      # 최종 ASG/Target 상태 확인
      # ----------------------------------------------------------
      - name: Verify ASG instances
        shell: bash
        run: |
          set -Eeuo pipefail

          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[].{InstanceId:InstanceId,Lifecycle:LifecycleState,Health:HealthStatus,LTVersion:LaunchTemplate.Version}" \
            --output table

          BAD_COUNT=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "length(AutoScalingGroups[0].Instances[?LifecycleState!='InService' || HealthStatus!='Healthy'])" \
            --output text)

          if [ "$BAD_COUNT" != "0" ]; then
            echo "InService/Healthy가 아닌 ASG 인스턴스가 있습니다."
            exit 1
          fi

      - name: Deployment summary
        env:
          AMI_ID: ${{ steps.ami.outputs.ami_id }}
          AMI_NAME: ${{ steps.ami.outputs.ami_name }}
          LT_VERSION: ${{ steps.lt.outputs.version }}
          REFRESH_ID: ${{ steps.refresh.outputs.refresh_id }}
        run: |
          {
            echo "## Mysite ASG 배포 완료"
            echo
            echo "- Django 테스트: 성공"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- AMI: \`${AMI_ID}\` (\`${AMI_NAME}\`)"
            echo "- Launch Template: \`${LAUNCH_TEMPLATE_NAME}\` v\`${LT_VERSION}\`"
            echo "- Auto Scaling Group: \`${ASG_NAME}\`"
            echo "- Instance Refresh: \`${REFRESH_ID}\`"
            echo "- DB migration: 완료"
            echo "- collectstatic/S3 sync: 완료"
            echo "- ASG 인스턴스: InService / Healthy 확인"
          } >> "$GITHUB_STEP_SUMMARY"